{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
    <div class="auth">
        <div class="auth-form">
            <h1>Login</h1>
            <form method="POST">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="btn">Login</button>
            </form>
            <p class="muted" style="margin-top:18px">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
        </div>
        <div class="auth-side">
            <h2>Your documents, and when they expire.</h2>
            <ul>
                <li>Expiry dates found for you</li>
                <li>Documents filed by category</li>
                <li>Warnings before anything lapses</li>
            </ul>
        </div>
    </div>
{% endblock %}
