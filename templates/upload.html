{% extends "base.html" %}
{% block title %}Upload Document{% endblock %}
{% block content %}
    <div class="narrow">
    <h1>Upload a document</h1>
    <div class="panel">
    <form method="POST" enctype="multipart/form-data" id="upload-form">
        <label>File (JPG or PNG, max 5 MB)</label>
        <div class="dropzone">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
            <strong id="file-name">Choose a photo or scan</strong>
            <span>or drop it here</span>
            <input type="file" name="file" accept=".jpg,.jpeg,.png" required>
        </div>
        <div class="preview-wrap" id="preview-wrap" hidden>
            <img id="preview-img" alt="Selected document">
            <i class="scan" aria-hidden="true"></i>
        </div>

        <label for="title">Title</label>
        <input type="text" id="title" name="title" maxlength="150" required>

        <label for="category">Category</label>
        <select id="category" name="category">
            <option value="auto" selected>Detect automatically</option>
            {% for c in categories %}
                <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>

        <label for="expiry_date">Expiry date (optional)</label>
        <input type="date" id="expiry_date" name="expiry_date">
        <p class="muted">Leave it empty and the app will look for the date in the document text.</p>

        <div class="form-actions">
            <button type="submit" class="btn" id="upload-button">Upload</button>
            <a class="btn secondary" href="{{ url_for('dashboard') }}">Cancel</a>
        </div>
    </form>
    </div>
    </div>
    <script>
        // Show the chosen file's name in the drop zone
        var zone = document.querySelector(".dropzone");
        zone.querySelector("input").addEventListener("change", function () {
            if (this.files.length) {
                document.getElementById("file-name").textContent = this.files[0].name;
                document.getElementById("preview-img").src = URL.createObjectURL(this.files[0]);
                document.getElementById("preview-wrap").hidden = false;
            }
        });
        ["dragenter", "dragover"].forEach(function (n) { zone.addEventListener(n, function () { zone.classList.add("over"); }); });
        ["dragleave", "drop"].forEach(function (n) { zone.addEventListener(n, function () { zone.classList.remove("over"); }); });
        // Reading the text takes a few seconds, so show that something is happening
        document.getElementById("upload-form").addEventListener("submit", function () {
            var button = document.getElementById("upload-button");
            document.getElementById("preview-wrap").classList.add("reading");
            button.disabled = true;
            button.textContent = "Uploading and reading text...";
        });
    </script>
{% endblock %}
